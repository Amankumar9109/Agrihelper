<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Your Post</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f6f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .post-form-container {
      background: #ffffff;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .post-form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #055e0c;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
    }

    input[type="file"] {
      padding: 5px;
    }

    button {
      background-color: #055e0c;
      color: white;
      padding: 12px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #044a09;
    }

    .note {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body style="background-color: #044a099c;">

  <div class="post-form-container">
    <h2>Share a Post with the Community</h2>
    <form id="postForm">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email (optional)" />
      <input type="text" name="title" placeholder="Post Title" required />
      <textarea name="content" rows="6" placeholder="Write your post here..." required></textarea>
      
      <button type="submit">Submit Post</button>
      <p class="note">Your post will be reviewed before being published.</p>
    </form>
  </div>
	<script>
    const postForm = document.getElementById("postForm");

    postForm.addEventListener("submit", function (event) {
      event.preventDefault(); // Prevent form from actually submitting
      alert("Thank you! Your post has been submitted and is pending review.");
      postForm.reset(); // Optional: clear the form after submission
    });
  </script>

</body>
</html>
